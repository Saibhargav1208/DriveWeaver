name: driveweaver
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - cudatoolkit=12.1

  # PyTorch (GPU)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1

  # Core scientific stack
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - opencv>=4.8.0
  - pillow>=10.0.0

  # Jupyter (optional, for development)
  - jupyter
  - ipython
  - notebook

  # Development tools
  - black
  - flake8
  - mypy
  - pytest

  # Install remaining packages via pip
  - pip:
      - pytorch-lightning>=2.0.0
      - hydra-core>=1.3.0
      - omegaconf>=2.3.0
      - nuscenes-devkit>=1.1.0
      - pyquaternion>=0.9.9
      - timm>=0.9.0
      - einops>=0.7.0
      - wandb>=0.15.0
      - transformers>=4.35.0
      - accelerate>=0.24.0
      - sentencepiece>=0.1.99
      - av>=10.0.0
      - ffmpeg-python>=0.2.0
      - python-dotenv>=1.0.0
      - scikit-image>=0.21.0
      - plotly>=5.14.0
      - tensorboard>=2.13.0
      - tqdm>=4.65.0
