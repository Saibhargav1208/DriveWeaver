# Planner B Default — Ablation 2: C-JEPA + VLM → Planner

model:
  slot_dim: 128
  num_slots: 11
  num_modes: 32
  history_length: 4
  future_length: 6
  cjepa_depth: 6
  cjepa_heads: 8
  cjepa_mlp_dim: 2048
  planner_decoder_layers: 3
  planner_heads: 8

data:
  slots_path: /work/data/slots/nuscenes_slots_full.pkl
  batch_size: 16
  stride: 1
  num_workers: 4

vlm_guidance:
  enable: true
  guidance_mode: film
  vlm_dim: 2048
  guidance_hidden: 512
  cache_dir: /work/data/vlm_cache/nuscenes/
  use_random: false
  random_tokens: 480

training:
  stage: 1
  max_epochs: 100
  learning_rate: 3e-4
  weight_decay: 1e-4
  clip_grad_norm: 1.0
  mixed_precision: true
  checkpoint_dir: /work/checkpoints/planner_b
  save_every: 10

loss:
  lambda_ade: 1.0
  lambda_fde: 0.5
  lambda_wta: 0.5
  lambda_diversity: 0.1
  lambda_smoothness: 0.1
  lambda_feasibility: 0.05
  diversity_sigma: 1.0
  penalize_jerk: true
  max_speed: 15.0
  max_accel: 4.0
  dt: 0.5

checkpoints:
  cjepa: /work/checkpoints/cjepa_vlm/best_model.pth
  planner: null

system:
  cuda: true
  seed: 42
