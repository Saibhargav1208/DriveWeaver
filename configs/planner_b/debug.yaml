# Planner B Debug — Ablation 2: C-JEPA + VLM → Planner

model:
  slot_dim: 128
  num_slots: 11
  num_modes: 16
  history_length: 4
  future_length: 6
  cjepa_depth: 2
  cjepa_heads: 4
  cjepa_mlp_dim: 1024
  planner_decoder_layers: 2
  planner_heads: 4

data:
  slots_path: /work/data/slots/nuscenes_slots_debug.pkl
  batch_size: 4
  stride: 2
  num_workers: 0

vlm_guidance:
  enable: true
  guidance_mode: film
  vlm_dim: 512
  guidance_hidden: 256
  cache_dir: null
  use_random: true
  random_tokens: 64

training:
  stage: 1
  max_epochs: 5
  learning_rate: 3e-4
  weight_decay: 1e-4
  clip_grad_norm: 1.0
  mixed_precision: false
  checkpoint_dir: /work/checkpoints/planner_b
  save_every: 2

loss:
  lambda_ade: 1.0
  lambda_fde: 0.5
  lambda_wta: 0.5
  lambda_diversity: 0.1
  lambda_smoothness: 0.1
  lambda_feasibility: 0.05
  diversity_sigma: 1.0
  penalize_jerk: true
  max_speed: 15.0
  max_accel: 4.0
  dt: 0.5

checkpoints:
  cjepa: /work/checkpoints/cjepa_vlm/best_model.pth
  planner: null

system:
  cuda: true
  seed: 42
