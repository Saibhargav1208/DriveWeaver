name: nuscenes_ablation2_cjepa_vlm_qwen3
dataset_config: configs/datasets/nuscenes.yaml
vlm_config: configs/vlms/qwen3_vl_2b_thinking.yaml

ablation:
  name: ablation2
  description: C-JEPA with Qwen3-VL guidance
  use_vlm_guidance: true

world_model:
  train_script: training/train_cjepa_vlm.py
  config: configs/cjepa_vlm/default.yaml
  checkpoint: /work/checkpoints/cjepa_vlm/best_model.pth
  future_slots_cache_dir: /work/data/future_slots/cjepa_vlm

planner:
  train_script: training/train_planner_b.py
  config: configs/planner_b/default.yaml
  checkpoint: /work/checkpoints/planner_b/best_model.pth
  output_dir: /work/outputs/planner_b_scoreloss_inference
  selection: proposal_scores_argmax
  oracle_script: scripts/inference_planner_b_oracle.py
  scorer_script: scripts/inference_planner_b.py

metrics:
  report:
    - scorer_ADE
    - scorer_FDE
    - scorer_MR_2m
    - oracle_ADE
    - oracle_FDE
    - oracle_MR_2m
    - selected_rank
